<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Enterprise Product Discovery App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            /* subtle background pattern */
            background-image: radial-gradient(#1e293b 1px, transparent 1px);
            background-size: 24px 24px;
        }

        /* Phone Hardware Frame */
        .phone-frame {
            width: 375px;
            height: 812px;
            background-color: #ffffff;
            border-radius: 50px;
            box-shadow: 0 0 0 12px #1e293b, 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            position: relative;
            overflow: hidden;
            transform: scale(0.9);
            transform-origin: center;
        }

        @media (max-width: 400px) {
            .phone-frame {
                transform: scale(0.85);
            }
        }

        /* Dynamic Island / Notch */
        .dynamic-island {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 35px;
            background-color: #000000;
            border-radius: 20px;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 12px;
        }

        .camera-lens {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #111;
            box-shadow: inset 0px 0px 4px rgba(255,255,255,0.2);
        }

        .sensor {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #222;
        }

        /* App Layout */
        .app-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background-color: #f8fafc;
        }

        .header {
            padding: 60px 24px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            z-index: 50;
            border-bottom: 1px solid #e2e8f0;
        }

        .card-stack {
            flex-grow: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
            overflow: hidden;
            padding: 20px;
        }

        .swipe-card {
            position: absolute;
            width: calc(100% - 40px);
            height: calc(100% - 100px);
            background: white;
            border-radius: 24px;
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            will-change: transform;
            touch-action: none;
            user-select: none;
            transition: transform 0.3s ease-out; /* For snapping back */
        }

        /* Remove transition during active dragging for zero-latency response */
        .swipe-card.dragging {
            transition: none;
        }

        .card-image-wrapper {
            height: 60%;
            width: 100%;
            background: #e2e8f0;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .card-content {
            padding: 24px;
            height: 40%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Status Stamps (Like/Pass) */
        .stamp {
            position: absolute;
            top: 40px;
            padding: 8px 16px;
            border: 4px solid;
            border-radius: 12px;
            font-size: 2rem;
            font-weight: 800;
            text-transform: uppercase;
            opacity: 0;
            z-index: 10;
            transform: scale(0.5);
            transition: opacity 0.2s, transform 0.2s;
        }

        .stamp.like {
            color: #10b981;
            border-color: #10b981;
            left: 20px;
            transform: rotate(-15deg);
        }

        .stamp.pass {
            color: #ef4444;
            border-color: #ef4444;
            right: 20px;
            transform: rotate(15deg);
        }

        .bottom-nav {
            height: 80px;
            background: white;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding-bottom: 20px; /* Safe area */
            border-top: 1px solid #e2e8f0;
            z-index: 50;
        }

        .nav-item {
            color: #94a3b8;
            font-size: 1.25rem;
            transition: color 0.2s;
            cursor: pointer;
        }

        .nav-item.active {
            color: #3b82f6;
        }

        .action-buttons {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 24px;
            z-index: 40;
            pointer-events: none; /* Let clicks pass through if empty space */
        }

        .action-btn {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            pointer-events: auto;
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .action-btn:active {
            transform: scale(0.95);
        }

        .btn-pass { color: #ef4444; }
        .btn-like { color: #10b981; }

        /* Cart Badge Animation */
        .badge {
            position: absolute;
            top: -5px;
            right: -8px;
            background: #ef4444;
            color: white;
            font-size: 0.65rem;
            font-weight: bold;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid white;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .badge.pop {
            transform: scale(1.5);
        }

        .empty-state {
            text-align: center;
            color: #64748b;
            padding: 40px;
            position: absolute;
            z-index: 0;
        }

        /* View Container Styles */
        .view-container {
            flex-grow: 1;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            overflow-x: hidden;
            width: 100%;
            background-color: #f8fafc;
        }

        .view-container.hidden {
            display: none !important;
        }

        /* Hide scrollbar for views to keep mobile feel */
        .view-container::-webkit-scrollbar {
            display: none;
        }
        .view-container {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
    </style>
</head>
<body>

    <div class="phone-frame">
        <!-- Hardware Notch -->
        <div class="dynamic-island">
            <div class="sensor"></div>
            <div class="camera-lens"></div>
        </div>

        <!-- Inner App -->
        <div class="app-container">

            <!-- App Header -->
            <div class="header">
                <div>
                    <h1 class="text-xl font-bold text-gray-800">Quantum<span class="text-blue-600">Enterprises</span></h1>
                    <p class="text-xs text-gray-500 font-medium tracking-wide uppercase mt-1">Resource Provisioning</p>
                </div>
                <div class="relative cursor-pointer" onclick="switchView('cart')">
                    <i class="fa-solid fa-cart-shopping text-xl text-gray-700"></i>
                    <div id="cart-badge-header" class="badge hidden">0</div>
                </div>
            </div>

            <!-- Home View (Swipe Cards) -->
            <div id="view-home" class="view-container">
                <div class="card-stack" id="card-container">
                    <div class="empty-state">
                        <i class="fa-solid fa-box-open text-4xl mb-4 text-gray-300"></i>
                        <h3 class="text-lg font-semibold text-gray-700">No more resources</h3>
                        <p class="text-sm mt-2">Check back later for new enterprise assets.</p>
                        <button onclick="resetCards()" class="mt-6 px-4 py-2 bg-blue-100 text-blue-700 rounded-full text-sm font-semibold hover:bg-blue-200 transition">
                            Reload Catalog
                        </button>
                    </div>
                    <!-- Cards will be injected here via JS -->

                    <!-- Manual Action Buttons -->
                    <div class="action-buttons">
                        <button class="action-btn btn-pass" onclick="handleManualAction('left')">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                        <button class="action-btn btn-like" onclick="handleManualAction('right')">
                            <i class="fa-solid fa-cart-plus"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Cart View -->
            <div id="view-cart" class="view-container hidden p-6">
                <h2 class="text-2xl font-bold text-gray-900 mb-4">Your Provisioning Cart</h2>
                <div id="cart-items-container" class="flex-grow space-y-4">
                    <!-- Cart items injected here -->
                    <div class="text-center text-gray-500 mt-10">Your cart is empty.</div>
                </div>
                <div class="mt-4 pt-4 border-t border-gray-200">
                    <button class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl shadow-lg hover:bg-blue-700 transition active:scale-95">
                        Deploy Resources
                    </button>
                </div>
            </div>

            <!-- Profile View -->
            <div id="view-profile" class="view-container hidden p-6">
                <div class="flex items-center gap-4 mb-8 mt-4">
                    <div class="w-16 h-16 rounded-full bg-gray-300 flex items-center justify-center text-gray-500 text-2xl overflow-hidden shadow-inner">
                        <i class="fa-solid fa-user"></i>
                    </div>
                    <div>
                        <h2 class="text-xl font-bold text-gray-900">Admin User</h2>
                        <p class="text-sm text-blue-600">Enterprise Level 4</p>
                    </div>
                </div>
                <div class="space-y-3">
                    <div class="p-4 bg-white rounded-xl shadow-sm border border-gray-100 flex items-center justify-between cursor-pointer active:bg-gray-50">
                        <div class="flex items-center gap-3 text-gray-700"><i class="fa-solid fa-file-invoice text-gray-400"></i> Billing Details</div>
                        <i class="fa-solid fa-chevron-right text-gray-300 text-sm"></i>
                    </div>
                    <div class="p-4 bg-white rounded-xl shadow-sm border border-gray-100 flex items-center justify-between cursor-pointer active:bg-gray-50">
                        <div class="flex items-center gap-3 text-gray-700"><i class="fa-solid fa-shield-halved text-gray-400"></i> Security Settings</div>
                        <i class="fa-solid fa-chevron-right text-gray-300 text-sm"></i>
                    </div>
                    <div class="p-4 bg-white rounded-xl shadow-sm border border-gray-100 flex items-center justify-between cursor-pointer active:bg-gray-50 text-red-500">
                        <div class="flex items-center gap-3"><i class="fa-solid fa-right-from-bracket opacity-70"></i> Sign Out</div>
                    </div>
                </div>
            </div>

            <!-- Bottom App Navigation -->
            <div class="bottom-nav">
                <div id="nav-home" class="nav-item active" onclick="switchView('home')"><i class="fa-solid fa-house"></i></div>
                <div id="nav-cart" class="nav-item relative" onclick="switchView('cart')">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <div id="cart-badge-nav" class="badge hidden">0</div>
                </div>
                <div id="nav-profile" class="nav-item" onclick="switchView('profile')"><i class="fa-regular fa-user"></i></div>
            </div>

        </div>
    </div>

    <script>
        // Dummy Enterprise Product Data
        const initialProducts = [
            {
                id: 1,
                name: "Quantum Cloud Cluster XS-9",
                category: "Infrastructure",
                price: "$4,500/mo",
                specs: "64 Core • 256GB RAM • 10TB NVMe",
                gradient: "linear-gradient(135deg, #3b82f6, #1e40af)",
                icon: "fa-server"
            },
            {
                id: 2,
                name: "Enterprise Data Shield",
                category: "Cybersecurity",
                price: "$1,200/mo",
                specs: "Zero-Trust Architecture • AI Threat Detection",
                gradient: "linear-gradient(135deg, #10b981, #047857)",
                icon: "fa-shield-halved"
            },
            {
                id: 3,
                name: "Nexus Developer Workspace",
                category: "Software",
                price: "$85/user",
                specs: "Integrated IDE • CI/CD Pipelines • Unlimited Repos",
                gradient: "linear-gradient(135deg, #8b5cf6, #5b21b6)",
                icon: "fa-code"
            },
            {
                id: 4,
                name: "Titanium Analytics DB",
                category: "Data Management",
                price: "$3,100/mo",
                specs: "Petabyte Scale • Sub-millisecond Queries",
                gradient: "linear-gradient(135deg, #f59e0b, #b45309)",
                icon: "fa-database"
            },
            {
                id: 5,
                name: "Global Edge CDN",
                category: "Networking",
                price: "Pay-as-you-go",
                specs: "300+ PoPs • DDoS Protection • WAF Included",
                gradient: "linear-gradient(135deg, #ec4899, #be185d)",
                icon: "fa-network-wired"
            }
        ];

        let products = [...initialProducts];
        let cartItems = [];
        const container = document.getElementById('card-container');
        let activeCard = null;

        // Variables for drag interaction
        let isDragging = false;
        let startX = 0, startY = 0;
        let currentX = 0, currentY = 0;
        let cardElement = null;

        const SWIPE_THRESHOLD = 120; // pixels required to trigger a swipe

        // View Switching Logic
        window.switchView = function(viewName) {
            // Hide all views
            document.getElementById('view-home').classList.add('hidden');
            document.getElementById('view-cart').classList.add('hidden');
            document.getElementById('view-profile').classList.add('hidden');

            // Show target view
            document.getElementById(`view-${viewName}`).classList.remove('hidden');

            // Update nav styles
            document.getElementById('nav-home').classList.remove('active');
            document.getElementById('nav-cart').classList.remove('active');
            document.getElementById('nav-profile').classList.remove('active');

            document.getElementById(`nav-${viewName}`).classList.add('active');

            // Render specific view data if needed
            if(viewName === 'cart') {
                renderCartView();
            }
        };

        function renderCartView() {
            const cartContainer = document.getElementById('cart-items-container');
            if (cartItems.length === 0) {
                cartContainer.innerHTML = '<div class="text-center text-gray-500 mt-10">Your cart is empty.</div>';
                return;
            }

            cartContainer.innerHTML = cartItems.map(item => `
                <div class="p-4 bg-white rounded-xl shadow-sm border border-gray-100 flex items-center gap-4">
                    <div class="w-12 h-12 rounded-lg flex items-center justify-center shrink-0 shadow-inner text-white" style="background: ${item.gradient}">
                        <i class="fa-solid ${item.icon}"></i>
                    </div>
                    <div class="flex-grow min-w-0">
                        <h4 class="font-bold text-gray-900 truncate text-sm">${item.name}</h4>
                        <p class="text-xs text-gray-500">${item.category}</p>
                    </div>
                    <div class="font-bold text-gray-800 text-sm whitespace-nowrap">${item.price}</div>
                </div>
            `).join('');
        }

        function renderCards() {
            // Remove existing cards to refresh
            const existingCards = document.querySelectorAll('.swipe-card');
            existingCards.forEach(c => c.remove());

            // Render top 3 cards for performance and visual depth
            const cardsToRender = products.slice(0, 3).reverse();

            cardsToRender.forEach((product, index) => {
                const card = document.createElement('div');
                card.className = 'swipe-card';
                // Only attach interactions to the top card (which is rendered last because of reverse)
                const isTopCard = index === cardsToRender.length - 1;

                if (isTopCard) {
                    card.id = 'top-card';
                }

                // Calculate scale and translation for background cards
                const scale = isTopCard ? 1 : 1 - ((cardsToRender.length - 1 - index) * 0.05);
                const translateY = isTopCard ? 0 : ((cardsToRender.length - 1 - index) * -15);

                card.style.transform = `scale(${scale}) translateY(${translateY}px)`;
                card.style.zIndex = index + 10;

                if (!isTopCard) {
                    // Slight dimming for background cards
                    card.style.filter = `brightness(${1 - (cardsToRender.length - 1 - index) * 0.1})`;
                }

                // Build Card HTML
                card.innerHTML = `
                    <div class="stamp like">CART +1</div>
                    <div class="stamp pass">PASS</div>
                    <div class="card-image-wrapper" style="background: ${product.gradient};">
                        <i class="fa-solid ${product.icon} text-6xl text-white opacity-90 drop-shadow-lg"></i>
                    </div>
                    <div class="card-content">
                        <div>
                            <span class="text-xs font-bold text-gray-400 uppercase tracking-wider">${product.category}</span>
                            <h2 class="text-xl font-bold text-gray-900 mt-1 leading-tight">${product.name}</h2>
                            <p class="text-sm text-gray-600 mt-2"><i class="fa-solid fa-microchip mr-1"></i> ${product.specs}</p>
                        </div>
                        <div class="flex justify-between items-end border-t border-gray-100 pt-3 mt-4">
                            <div>
                                <span class="text-xs text-gray-500">Estimated Cost</span>
                                <div class="text-lg font-bold text-gray-900">${product.price}</div>
                            </div>
                        </div>
                    </div>
                `;

                // Insert before action buttons
                container.insertBefore(card, container.querySelector('.action-buttons'));

                if (isTopCard) {
                    attachEvents(card);
                }
            });
        }

        function attachEvents(card) {
            cardElement = card;

            // Unified pointer events cover mouse, touch, and pen
            card.addEventListener('pointerdown', handlePointerDown);
            window.addEventListener('pointermove', handlePointerMove);
            window.addEventListener('pointerup', handlePointerUp);
            window.addEventListener('pointercancel', handlePointerUp);
        }

        function removeEvents() {
            if (cardElement) {
                cardElement.removeEventListener('pointerdown', handlePointerDown);
            }
            window.removeEventListener('pointermove', handlePointerMove);
            window.removeEventListener('pointerup', handlePointerUp);
            window.removeEventListener('pointercancel', handlePointerUp);
            // Removed cardElement = null; from here so animateOut can still use it
        }

        function handlePointerDown(e) {
            // Prevent interaction if already animating out
            if (cardElement.style.transition.includes('transform 0.5s')) return;

            isDragging = true;
            startX = e.clientX;
            startY = e.clientY;
            cardElement.classList.add('dragging');
        }

        function handlePointerMove(e) {
            if (!isDragging) return;

            currentX = e.clientX - startX;
            currentY = e.clientY - startY;

            // Calculate rotation based on X movement
            const rotate = currentX * 0.05;

            // Apply transform
            cardElement.style.transform = `translate(${currentX}px, ${currentY}px) rotate(${rotate}deg)`;

            // Handle Opacity of Stamps
            const likeStamp = cardElement.querySelector('.stamp.like');
            const passStamp = cardElement.querySelector('.stamp.pass');

            if (currentX > 0) {
                // Moving right (Like)
                likeStamp.style.opacity = Math.min(currentX / 100, 1);
                passStamp.style.opacity = 0;
            } else {
                // Moving left (Pass)
                passStamp.style.opacity = Math.min(Math.abs(currentX) / 100, 1);
                likeStamp.style.opacity = 0;
            }
        }

        function handlePointerUp(e) {
            if (!isDragging) return;
            isDragging = false;
            cardElement.classList.remove('dragging');

            const likeStamp = cardElement.querySelector('.stamp.like');
            const passStamp = cardElement.querySelector('.stamp.pass');

            // Determine if threshold is met
            if (currentX > SWIPE_THRESHOLD) {
                // Swiped Right
                animateOut('right');
            } else if (currentX < -SWIPE_THRESHOLD) {
                // Swiped Left
                animateOut('left');
            } else {
                // Snap back
                cardElement.style.transform = `translate(0px, 0px) rotate(0deg)`;
                likeStamp.style.opacity = 0;
                passStamp.style.opacity = 0;
            }

            // Reset values
            currentX = 0;
            currentY = 0;
        }

        function animateOut(direction) {
            removeEvents();

            const screenWidth = window.innerWidth;
            const targetX = direction === 'right' ? screenWidth : -screenWidth;
            const targetY = currentY + (direction === 'right' ? 50 : -50); // slight arc
            const rotate = direction === 'right' ? 30 : -30;

            // Apply exit transition
            cardElement.style.transition = 'transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
            cardElement.style.transform = `translate(${targetX}px, ${targetY}px) rotate(${rotate}deg)`;

            // Ensure correct stamp is fully visible and handle cart logic
            if (direction === 'right') {
                cardElement.querySelector('.stamp.like').style.opacity = 1;
                addToCart(products[0]);
            } else {
                cardElement.querySelector('.stamp.pass').style.opacity = 1;
            }

            // Wait for animation, then update queue
            setTimeout(() => {
                products.shift(); // Remove top product
                renderCards();    // Re-render
                cardElement = null; // Clean up the reference after animation completes
            }, 300); // match transition duration slightly less to feel snappy
        }

        // Expose action for the bottom buttons (the red/green swipe controls)
        window.handleManualAction = function(direction) {
            const card = document.getElementById('top-card');
            if (!card) return; // No cards left

            cardElement = card;
            // Force stamps visible
            if(direction === 'right') {
                card.querySelector('.stamp.like').style.opacity = 1;
            } else {
                card.querySelector('.stamp.pass').style.opacity = 1;
            }
            animateOut(direction);
        };

        function addToCart(product) {
            cartItems.push(product);

            const badgeHeader = document.getElementById('cart-badge-header');
            const badgeNav = document.getElementById('cart-badge-nav');

            const count = cartItems.length;

            [badgeHeader, badgeNav].forEach(badge => {
                if (badge) {
                    badge.textContent = count;
                    badge.classList.remove('hidden');

                    // Pop animation
                    badge.classList.add('pop');
                    setTimeout(() => {
                        badge.classList.remove('pop');
                    }, 300);
                }
            });
        }

        window.resetCards = function() {
            products = [...initialProducts];
            cartItems = []; // Clear cart on reset for demo purposes

            const badgeHeader = document.getElementById('cart-badge-header');
            const badgeNav = document.getElementById('cart-badge-nav');
            if (badgeHeader) badgeHeader.classList.add('hidden');
            if (badgeNav) badgeNav.classList.add('hidden');

            renderCards();
            if(!document.getElementById('view-cart').classList.contains('hidden')){
                renderCartView();
            }
        };

        // Initialize the app
        window.onload = () => {
            renderCards();
        };

    </script>
</body>
</html>
